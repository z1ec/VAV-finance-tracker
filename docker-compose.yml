# Local development: builds both images from source.
#   cp .env.example .env && docker compose up -d --build && open http://localhost:8080
# Production uses prebuilt GHCR images: deploy/docker-compose.prod.yml (see docs/DEPLOYMENT.md).
services:
  backend:
    build:
      context: ./backend
      args:
        APP_VERSION: dev
        GIT_SHA: local
    env_file: .env
    environment:
      DB_PATH: /data/expenses.db
      BACKUP_DIR: /data/backups
    volumes:
      # The container runs as uid 10001: on Linux run `sudo chown -R 10001:10001 data` once.
      - ./data:/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    environment:
      DOMAIN: localhost
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped
