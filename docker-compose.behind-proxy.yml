# For a host where port 80/443 is already owned by another web server
# (e.g. nginx serving other sites). Caddy here only binds to loopback on
# CADDY_INTERNAL_PORT (default 8080) — nothing is exposed publicly by this
# stack. Point the existing web server's reverse proxy at 127.0.0.1:8080
# and let it handle TLS (see README).
#
# Usage: docker compose -f docker-compose.behind-proxy.yml up -d --build
services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      USER1_USERNAME: ${USER1_USERNAME}
      USER1_PASSWORD: ${USER1_PASSWORD}
      USER2_USERNAME: ${USER2_USERNAME}
      USER2_PASSWORD: ${USER2_PASSWORD}
      DB_PATH: /data/expenses.db
      TZ: ${TZ:-Europe/Budapest}
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./data:/data
    expose:
      - "8000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${CADDY_INTERNAL_PORT:-8080}:80"
    volumes:
      - ./Caddyfile.behind-proxy:/etc/caddy/Caddyfile:ro
      - ./frontend:/srv:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
