# Dependency updates (stage 3b, docs/SECURITY.md). Every PR goes through CI including the
# `security` job (pip-audit, trivy); nothing is merged automatically.
version: 2
updates:
  # Python: requirements.in (direct) → requirements.txt (full lock), requirements-dev.txt.
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  # Third-party actions are pinned by commit SHA (with a version comment); Dependabot bumps both.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies]
    groups:
      actions:
        patterns: ["*"]

  # Base images: python:3.12-slim (backend) and caddy:2-alpine (web).
  - package-ecosystem: docker
    directories: [/backend, /web]
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies]
