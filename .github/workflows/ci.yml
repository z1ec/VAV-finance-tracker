name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:
  workflow_call:
  # Weekly: new CVEs in unchanged dependencies/base images fail the `security` job.
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  # github.workflow differs when called from deploy.yml, so the two runs never cancel each other.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint · typecheck · tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: backend/requirements*.txt

      - name: Install Python 3.12 and dependencies
        run: |
          uv python install 3.12
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -r requirements-dev.txt
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (format)
        run: ruff format --check .

      - name: Ruff (repo scripts)
        run: |
          ruff check --config pyproject.toml ../scripts
          ruff format --config pyproject.toml --check ../scripts

      - name: Mypy
        run: mypy

      - name: Pytest with coverage (includes deploy.sh dry-run tests)
        run: pytest --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-xml
          path: backend/coverage.xml
          retention-days: 7

  config-lint:
    name: actionlint · shellcheck · deploy.sh dry run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: actionlint
        run: uvx --from actionlint-py actionlint -color

      - name: shellcheck
        run: uvx --from shellcheck-py shellcheck deploy/*.sh scripts/*.sh

      - name: deploy.sh dry-run tests
        working-directory: backend
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -r requirements-dev.txt
          .venv/bin/pytest tests/test_deploy_script.py --no-cov -v -rs

  docker-build:
    name: docker build + smoke test (no push)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          push: false
          load: true
          tags: finance-tracker-backend:ci
          build-args: |
            APP_VERSION=ci
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: web/Dockerfile
          push: false
          load: true
          tags: finance-tracker-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Smoke test backend (test .env, DOMAIN=localhost)
        run: |
          {
            echo "SECRET_KEY=$(openssl rand -hex 32)"
            echo "ADMIN_USERNAME=admin"
            echo "ADMIN_PASSWORD=$(openssl rand -hex 16)"
            echo "USER1_USERNAME=user1"
            echo "USER1_PASSWORD=$(openssl rand -hex 16)"
            echo "USER2_USERNAME="
            echo "USER2_PASSWORD="
            echo "DOMAIN=localhost"
            echo "TZ=Europe/Budapest"
          } > smoke.env
          docker run -d --name smoke --env-file smoke.env -p 8000:8000 finance-tracker-backend:ci
          for _ in $(seq 1 30); do
            code="$(curl -s -o health.json -w '%{http_code}' http://127.0.0.1:8000/api/health || true)"
            if [ "$code" = "200" ]; then break; fi
            sleep 2
          done
          docker logs smoke | tail -20
          cat health.json; echo
          test "$code" = "200"
          grep -q '"db":"ok"' health.json
          grep -q '"version":"ci"' health.json
          test "$(docker exec smoke id -u)" = "10001"
          for _ in $(seq 1 30); do
            status="$(docker inspect --format '{{.State.Health.Status}}' smoke)"
            if [ "$status" = "healthy" ]; then break; fi
            sleep 2
          done
          echo "docker health: $status"
          test "$status" = "healthy"

      - name: Smoke test backend refuses default secrets on a real domain
        run: |
          printf 'DOMAIN=finance.example.com\nSECRET_KEY=canary7Q\nADMIN_PASSWORD=canary9Z\n' > insecure.env
          if docker run --rm --env-file insecure.env finance-tracker-backend:ci > insecure.log 2>&1
          then
            echo "::error::backend started with insecure secrets"; exit 1
          fi
          grep -q "Refusing to start with insecure secrets" insecure.log
          if grep -q "canary" insecure.log; then echo "::error::secret value leaked"; exit 1; fi

      - name: E2E bot API (throwaway containers, Caddy experiment, idempotency)
        run: scripts/e2e_bot_api.sh finance-tracker-backend:ci finance-tracker-web:ci

      - name: Validate web Caddyfile
        run: |
          docker run --rm finance-tracker-web:ci caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          docker run --rm -e DOMAIN=finance.fomin-vladimir.ru finance-tracker-web:ci \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Clean up
        if: always()
        run: docker rm -f smoke >/dev/null 2>&1 || true

  security:
    name: security · gitleaks · pip-audit · trivy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Scanners run from images pinned by digest (no third-party actions; docs/SECURITY.md).
      GITLEAKS_IMAGE: zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f # v8.30.1
      TRIVY_IMAGE: aquasec/trivy@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c # 0.76.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the whole history
          persist-credentials: false

      - name: gitleaks (secrets in the full git history)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            "$GITLEAKS_IMAGE" git /repo --log-opts=--all --config /repo/.gitleaks.toml \
            --redact --no-banner --exit-code 1 -v

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: pip-audit (runtime lock backend/requirements.txt)
        run: |
          uvx --from pip-audit==2.10.1 pip-audit -r backend/requirements.txt \
            --no-deps --disable-pip --strict --desc on

      - name: pip-audit (development tools)
        run: |
          uvx --from pip-audit==2.10.1 pip-audit -r backend/requirements-dev.txt --strict --desc on

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          push: false
          load: true
          pull: true
          tags: finance-tracker-backend:scan
          cache-from: type=gha,scope=backend

      - name: Build web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: web/Dockerfile
          push: false
          load: true
          pull: true
          tags: finance-tracker-web:scan
          cache-from: type=gha,scope=web

      - name: trivy (fail on HIGH/CRITICAL with a fix; secrets in layers)
        run: |
          for image in finance-tracker-backend:scan finance-tracker-web:scan; do
            echo "::group::trivy ${image}"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$PWD/.trivyignore:/.trivyignore:ro" "$TRIVY_IMAGE" image \
              --severity HIGH,CRITICAL --ignore-unfixed --ignorefile /.trivyignore \
              --scanners vuln,secret --exit-code 1 --no-progress "${image}"
            echo "::endgroup::"
          done

      - name: Image history has no secrets
        run: |
          for image in finance-tracker-backend:scan finance-tracker-web:scan; do
            if docker history --no-trunc --format '{{.CreatedBy}}' "${image}" \
              | grep -iE 'secret_key=|password=|token=|BEGIN [A-Z ]*PRIVATE KEY'; then
              echo "::error::${image}: secret-looking value in the image history"; exit 1
            fi
          done
          echo "no secrets in image history"
