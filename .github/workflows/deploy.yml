name: Deploy

# push to main  → CI → build & push both images to GHCR → deploy over SSH (if DEPLOY_ENABLED=true)
# manual run    → with image_tag: redeploy/roll back to that tag (no build)
#                 without image_tag: CI → build current ref → deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Existing image tag to deploy, e.g. sha-abc1234 (empty = build this ref)"
        required: false
        default: ""

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    if: github.event_name == 'push' || inputs.image_tag == ''
    uses: ./.github/workflows/ci.yml

  build:
    name: build & push images
    needs: ci
    if: github.event_name == 'push' || inputs.image_tag == ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Compute image names, tag and version
        id: meta
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          short="${GITHUB_SHA::7}"
          version="$(grep -m1 '^version = ' backend/pyproject.toml | cut -d'"' -f2)"
          {
            echo "prefix=ghcr.io/${owner}/finance-tracker"
            echo "tag=sha-${short}"
            echo "short=${short}"
            echo "version=${version}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: true
          platforms: ${{ vars.DEPLOY_PLATFORM || 'linux/amd64' }}
          tags: |
            ${{ steps.meta.outputs.prefix }}-backend:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.prefix }}-backend:latest
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            GIT_SHA=${{ steps.meta.outputs.short }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: web/Dockerfile
          push: true
          platforms: ${{ vars.DEPLOY_PLATFORM || 'linux/amd64' }}
          tags: |
            ${{ steps.meta.outputs.prefix }}-web:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.prefix }}-web:latest
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            GIT_SHA=${{ steps.meta.outputs.short }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    name: deploy to server
    needs: [ci, build]
    # Skipped (pipeline stays green) until the server is configured and DEPLOY_ENABLED=true.
    if: ${{ !cancelled() && !failure() && vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      # Not secrets: as variables they are not masked, so the log stays readable.
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      DEPLOY_DIR: /opt/finance-tracker
      IMAGE_TAG: ${{ inputs.image_tag || needs.build.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: deploy

      - name: Check inputs
        run: |
          test -n "$IMAGE_TAG" || { echo "::error::no image tag to deploy"; exit 1; }
          [[ "$IMAGE_TAG" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::invalid image tag"; exit 1; }
          test -n "$DEPLOY_HOST" || { echo "::error::secret DEPLOY_HOST is missing"; exit 1; }
          test -n "$DEPLOY_USER" || { echo "::error::variable DEPLOY_USER is missing"; exit 1; }
          echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/finance-tracker" >> "$GITHUB_ENV"

      - name: Configure SSH (key + pinned host key)
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Copy compose file and deploy script
        run: |
          scp -i ~/.ssh/deploy_key -P "$DEPLOY_PORT" -o StrictHostKeyChecking=yes \
            deploy/docker-compose.prod.yml deploy/deploy.sh \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_DIR/"

      - name: Deploy ${{ env.IMAGE_TAG }} (health check + automatic rollback)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" \
            -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "chmod +x $DEPLOY_DIR/deploy.sh && $DEPLOY_DIR/deploy.sh '$IMAGE_TAG' '$IMAGE_PREFIX' '${{ github.actor }}'"

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

      - name: Summary
        if: always()
        run: |
          echo "### Deploy ${IMAGE_TAG}: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Roll back: Actions → Deploy → Run workflow → image_tag=<previous sha-tag>" \
            >> "$GITHUB_STEP_SUMMARY"
