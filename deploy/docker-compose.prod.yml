# Production stack on the shared server (/opt/finance-tracker), started by deploy/deploy.sh.
# Both images share one tag (IMAGE_TAG, e.g. sha-abc1234). Secrets live only in ./.env on the
# server; DOMAIN is read from the same file for interpolation.
name: finance-tracker

services:
  backend:
    image: ${IMAGE_PREFIX:-ghcr.io/z1ec/finance-tracker}-backend:${IMAGE_TAG:?IMAGE_TAG is required}
    env_file: .env
    environment:
      DB_PATH: /data/expenses.db
      BACKUP_DIR: /data/backups
    volumes:
      - ./data:/data
    restart: unless-stopped
    stop_grace_period: 20s
    # Hardening (stage 3b): the app only writes /data (bind mount) and /tmp; it needs no Linux
    # capabilities (uid 10001, port 8000) and must never gain privileges.
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks:
      default: {}
      # Shared with the Momentum bot (stage 2): reachable as http://finance-backend:8000.
      vav-internal:
        aliases:
          - finance-backend
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    image: ${IMAGE_PREFIX:-ghcr.io/z1ec/finance-tracker}-web:${IMAGE_TAG:?IMAGE_TAG is required}
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN must be set in .env}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "8443:8443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    # Caddy runs as root in the official image (certificates live in root-owned volumes); it
    # keeps only the capability to bind 80/443 and writes nothing outside its volumes and /tmp.
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    networks:
      - default
    logging: *logging

networks:
  default: {}
  vav-internal:
    external: true

volumes:
  caddy_data:
  caddy_config:
